name: h2au CI Check

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: "CI Build Check"
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Tools, OpenCV & I2C Libs
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libopencv-dev libi2c-dev i2c-tools

    - name: Cache ONNX Runtime
      id: cache-onnxruntime
      uses: actions/cache@v4
      with:
        path: /tmp/onnxruntime
        key: ${{ runner.os }}-onnxruntime-1.20.1
        save-always: true

    - name: Download ONNX Runtime (if not cached)
      if: steps.cache-onnxruntime.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz -O onnxruntime.tgz
        mkdir -p /tmp/onnxruntime
        tar xzf onnxruntime.tgz -C /tmp/onnxruntime --strip-components=1

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DONNXRUNTIME_ROOT=/tmp/onnxruntime \
          -DCMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu/cmake/opencv4"

    - name: Build Project
      run: cmake --build build --config Release
